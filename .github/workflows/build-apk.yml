name: Bangun APK Orbit
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/build-apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Bangun APK (release, sudah ditandatangani)
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon
      - name: Ganti nama
        run: cp android/app/build/outputs/apk/release/app-release.apk Orbit.apk
      - uses: actions/upload-artifact@v4
        with: { name: Orbit-APK, path: Orbit.apk }
      - name: Rilis (agar APK bisa diunduh dari HP)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-terbaru
          name: Orbit APK terbaru
          files: Orbit.apk
