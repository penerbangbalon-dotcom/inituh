plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}
android {
    namespace 'id.orbit.obrolan'
    compileSdk 34
    defaultConfig {
        applicationId 'id.orbit.obrolan'
        minSdk 27
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }
    signingConfigs {
        orbit {
            storeFile file('../orbit.jks')
            storePassword 'orbit-apk-2026'
            keyAlias 'orbit'
            keyPassword 'orbit-apk-2026'
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.orbit; minifyEnabled false }
    }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
}
