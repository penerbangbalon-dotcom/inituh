plugins { id 'com.android.application' }
android {
    namespace 'id.orbit.obrolan'
    compileSdk 34
    defaultConfig {
        applicationId 'id.orbit.obrolan'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        orbit {
            storeFile file('../orbit.jks')
            storePassword 'orbit-apk-2026'
            keyAlias 'orbit'
            keyPassword 'orbit-apk-2026'
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.orbit; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
